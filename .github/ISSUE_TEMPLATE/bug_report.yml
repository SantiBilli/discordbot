name: Bug report
description: Report a reproducible problem. English or Spanish is welcome.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include tokens, .env files, webhooks, or private data. Report vulnerabilities through SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Commit or release
      description: Which commit/release are you running?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker/Dokploy or local Python, versions, and affected provider.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Commands and steps using public/example links and no credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, webhooks, personal details, and private server/channel identifiers.
      render: text
