name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DISCORD_TOKEN: ""
      RADIO_STATE_FILE: /tmp/astramusic-ci/radio.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Compose
        env:
          DISCORD_TOKEN: ci-placeholder
        run: docker compose config --quiet
      - name: Build image
        run: docker build --tag astramusic:ci .
      - name: Verify runtime tools and non-root user
        run: |
          docker run --rm --entrypoint sh astramusic:ci -c '
            test "$(id -u)" != "0" &&
            test -w /app/data &&
            ffmpeg -version >/dev/null &&
            deno --version >/dev/null &&
            python -m pip check &&
            python -c "import ctypes, discord, media, radio, state; ctypes.CDLL(\"libopus.so.0\")"
          '

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory
          -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact=100 --no-banner
      - name: Scan tracked files
        run: |
          scan_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$scan_dir"
          docker run --rm -v "$scan_dir:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact=100 --no-banner
